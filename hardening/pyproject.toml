[project]
name = "archive-hardening"
version = "0.1.0"
description = "Audits the Kubernetes manifests of Ship Archive Lite against its security rules"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.2"]

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
