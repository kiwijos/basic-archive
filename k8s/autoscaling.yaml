---
# OCR is CPU-bound, so busy readers add readers.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transcribe-worker
  namespace: ship-archive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transcribe-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120
---
# Tiles are CPU-bound; each replica holds about 1.1 GiB, so the ceiling is low.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cantaloupe
  namespace: ship-archive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cantaloupe
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120
