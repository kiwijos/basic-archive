apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: ship-archive
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
    - name: admin
      port: 3903
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: ship-archive
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        # Garage once ran as root, so a volume from before slice 13 holds root-owned files. A volume of this kind is not
        # re-owned by the kubelet, so this hands it to the user Garage now runs as. It does nothing on a volume that is
        # already right, and goes once every cluster has been redeployed. The one container here allowed to be root.
        - name: own-volume
          image: busybox:1.37.0
          command: ["chown", "-R", "10001:10001", "/var/lib/garage"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          # Garage will only read a secret file that is mode 0600 and owned by its own user, which a Kubernetes
          # Secret volume cannot be, so the two secrets reach it as environment variables.
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: rpc-secret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: admin-token
          # Garage has no shell and answers its health check only once a layout exists,
          # so readiness only asks that the S3 port is open; the init Job does the rest.
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Safe to run again at any time: it only creates what is missing and re-sets permissions.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  namespace: ship-archive
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: garage-init
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: init
          image: python:3.12.15-slim-trixie
          command: ["python", "/init/init.py"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: GARAGE_ADMIN_URL
              value: http://garage:3903
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: admin-token
            - name: CATALOG_API_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: catalog-api-s3
                  key: S3_ACCESS_KEY_ID
            - name: CATALOG_API_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-api-s3
                  key: S3_SECRET_ACCESS_KEY
            - name: CANTALOUPE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cantaloupe-s3
                  key: S3_ACCESS_KEY_ID
            - name: CANTALOUPE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cantaloupe-s3
                  key: S3_SECRET_ACCESS_KEY
          volumeMounts:
            - name: init
              mountPath: /init
      volumes:
        - name: init
          configMap:
            name: garage-init
