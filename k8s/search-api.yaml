apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: ship-archive
spec:
  selector:
    app: search-api
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: ship-archive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      containers:
        - name: search-api
          image: kiwijos/ship-archive-search-api
          ports:
            - name: http
              containerPort: 8000
          # No database credentials: the only secret is a search-only Meilisearch key.
          envFrom:
            - secretRef:
                name: search-api-env
          env:
            - name: MEILI_URL
              value: http://meilisearch:7700
            - name: IIIF_BASE_URL
              value: /iiif/3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
