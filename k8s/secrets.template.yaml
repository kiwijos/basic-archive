# Template only. Real values are generated by scripts/create-secrets.sh and never committed.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ship-archive
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secrets
  namespace: ship-archive
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://postgres:CHANGE_ME@postgres:5432/archive
  # "name=token" pairs; the name becomes the author of every change made with that token
  STAFF_TOKENS: alice=CHANGE_ME,bob=CHANGE_ME
