# Template only. Real values are generated by scripts/create-secrets.sh and never committed.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ship-archive
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secrets
  namespace: ship-archive
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://postgres:CHANGE_ME@postgres:5432/archive
  # "name=token" pairs; the name becomes the author of every change made with that token
  STAFF_TOKENS: alice=CHANGE_ME,bob=CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: ship-archive
type: Opaque
stringData:
  rpc-secret: CHANGE_ME_64_HEX_CHARACTERS
  admin-token: CHANGE_ME
---
# One access key per service. Garage keys are "GK" followed by 24 hex characters,
# secrets are 64 hex characters. The Garage init Job imports them and sets each key's rights.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-s3
  namespace: ship-archive
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: GKCHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: cantaloupe-s3
  namespace: ship-archive
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: GKCHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: ship-archive
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: archive
  RABBITMQ_DEFAULT_PASS: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-amqp
  namespace: ship-archive
type: Opaque
stringData:
  RABBITMQ_URL: amqp://archive:CHANGE_ME@rabbitmq:5672/%2F
---
# A token for services that act on the API, in the same "name=token" shape as the staff tokens.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-service-tokens
  namespace: ship-archive
type: Opaque
stringData:
  SERVICE_TOKENS: transcribe-worker=CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: transcribe-worker-env
  namespace: ship-archive
type: Opaque
stringData:
  RABBITMQ_URL: amqp://archive:CHANGE_ME@rabbitmq:5672/%2F
  CATALOG_API_TOKEN: CHANGE_ME
---
# Meilisearch's master key. Services never get it: each gets a key derived from it that can do only
# what that service needs (see k8s/meilisearch/keys.json).
apiVersion: v1
kind: Secret
metadata:
  name: meilisearch-secrets
  namespace: ship-archive
type: Opaque
stringData:
  MEILI_MASTER_KEY: CHANGE_ME
---
# The indexer: its broker login, its own token on catalog-api (also listed as indexer=... in
# catalog-api-service-tokens), its write-only Meilisearch key, and the token that protects /reindex.
apiVersion: v1
kind: Secret
metadata:
  name: indexer-env
  namespace: ship-archive
type: Opaque
stringData:
  RABBITMQ_URL: CHANGE_ME
  CATALOG_API_TOKEN: CHANGE_ME
  MEILI_KEY: CHANGE_ME
  REINDEX_TOKEN: CHANGE_ME
---
# search-api holds only a search key: no database credentials and no write access.
apiVersion: v1
kind: Secret
metadata:
  name: search-api-env
  namespace: ship-archive
type: Opaque
stringData:
  MEILI_KEY: CHANGE_ME
---
# The Ingress's self-signed certificate; scripts/create-secrets.sh generates it. Replace it with a real one in production.
apiVersion: v1
kind: Secret
metadata:
  name: ship-archive-tls
  namespace: ship-archive
type: kubernetes.io/tls
stringData:
  tls.crt: CHANGE_ME_PEM_CERTIFICATE
  tls.key: CHANGE_ME_PEM_PRIVATE_KEY
---
# One broker login per service, created by the broker when it starts (k8s/rabbitmq/provision.sh). Each service's own
# RABBITMQ_URL (catalog-api-amqp, transcribe-worker-env, indexer-env) holds its login and password.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-users
  namespace: ship-archive
type: Opaque
stringData:
  CATALOG_API_PASSWORD: CHANGE_ME
  TRANSCRIBE_WORKER_PASSWORD: CHANGE_ME
  INDEXER_PASSWORD: CHANGE_ME
