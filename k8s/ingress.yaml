apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ship-archive
  namespace: ship-archive
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 8000
