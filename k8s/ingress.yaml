apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ship-archive
  namespace: ship-archive
spec:
  ingressClassName: traefik
  # HTTPS with the self-signed certificate (scripts/create-secrets.sh). Plain HTTP is still served, so scripts on this
  # machine need no certificate flags; see the README on why a real deployment would redirect it.
  tls:
    - hosts: [localhost]
      secretName: ship-archive-tls
  rules:
    - http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 8000
          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: search-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port:
                  number: 8080
