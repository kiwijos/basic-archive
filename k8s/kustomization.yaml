apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - catalog-api.yaml
  - ingress.yaml
# One version tag per slice; every custom image is pinned to it and never uses latest.
images:
  - name: kiwijos/ship-archive-catalog-api
    newTag: 0.1.0
