apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - garage.yaml
  - rabbitmq.yaml
  - catalog-api.yaml
  - transcribe-worker.yaml
  - web-ui.yaml
  - ingress.yaml
configMapGenerator:
  - name: garage-config
    namespace: ship-archive
    files:
      - garage/garage.toml
  - name: garage-init
    namespace: ship-archive
    files:
      - garage/init.py
  - name: rabbitmq-config
    namespace: ship-archive
    files:
      - rabbitmq/definitions.json
# One version tag per slice; every custom image is pinned to it and never uses latest.
images:
  - name: kiwijos/ship-archive-catalog-api
    newTag: 0.5.0
  - name: kiwijos/ship-archive-transcribe-worker
    newTag: 0.5.0
  - name: kiwijos/ship-archive-web-ui
    newTag: 0.5.0
