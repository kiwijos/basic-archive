# Cantaloupe serves IIIF Image API 3 for the archive's original scans, read from Garage.
# Anything environment-specific comes from the environment: a setting is read from the variable named
# like its key in capitals with punctuation made underscores (S3Source.endpoint is S3SOURCE_ENDPOINT),
# and the S3 credentials from AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (see the manifest).

http.enabled = true
http.host = 0.0.0.0
http.port = 8182
https.enabled = false

# Links in info.json follow the address the visitor used (Traefik passes it on), never a configured host.
base_uri =
slash_substitute =

# Only the IIIF Image API 3 is served. The admin and management endpoints are off.
endpoint.iiif.1.enabled = false
endpoint.iiif.2.enabled = false
endpoint.iiif.3.enabled = true
endpoint.iiif.min_size = 64
endpoint.iiif.min_tile_size = 256
endpoint.iiif.restrict_to_sizes = false
endpoint.admin.enabled = false
endpoint.api.enabled = false
endpoint.health.enabled = true
endpoint.health.dependency_check = false

# The largest picture one request may ask for, so no one can ask for a whole blueprint at full size.
# Tiles are far smaller, so deep zoom is unaffected.
max_pixels = 10000000
max_scale = 1.0

delegate_script.enabled = false

# The identifier in the address is the Image id, and the object in the masters bucket is named by the
# same id with nothing added (see ADR 0006).
source.static = S3Source
source.delegate = false
S3Source.endpoint =
S3Source.region = garage
S3Source.lookup_strategy = BasicLookupStrategy
S3Source.BasicLookupStrategy.bucket.name = masters
S3Source.BasicLookupStrategy.path_prefix =
S3Source.BasicLookupStrategy.path_suffix =
S3Source.chunking.enabled = true
S3Source.chunking.chunk_size = 512K
S3Source.chunking.cache.enabled = true
S3Source.chunking.cache.max_size = 5M

processor.selection_strategy = AutomaticSelectionStrategy
processor.fallback = Java2dProcessor
processor.stream_retrieval_strategy = CacheStrategy
processor.fallback_retrieval_strategy = DownloadStrategy
processor.dpi = 72
processor.background_color = white
processor.downscale_filter = bicubic
processor.upscale_filter = bicubic
processor.sharpen = 0
processor.jpg.progressive = true
processor.jpg.quality = 80
processor.limit_to_8_bits = true

# Originals never change under their id, so answers can be kept by the browser and by Traefik for a week.
cache.client.enabled = true
cache.client.max_age = 604800
cache.client.shared_max_age =
cache.client.public = true
cache.client.private = false
cache.client.no_cache = false
cache.client.no_store = false
cache.client.must_revalidate = false
cache.client.proxy_revalidate = false
cache.client.no_transform = true

# Cutting a tile out of a large JPEG or PNG means decoding all of it, so the original is kept on local
# disk after the first request and every tile made from it is kept too. Both are safe to lose.
cache.server.source = FilesystemCache
cache.server.source.ttl_seconds = 86400
cache.server.derivative.enabled = true
cache.server.derivative = FilesystemCache
cache.server.derivative.ttl_seconds = 604800
cache.server.resolve.enabled = false
cache.server.purge_missing = false
cache.server.worker.enabled = true
cache.server.worker.interval = 3600
FilesystemCache.pathname = /var/cache/cantaloupe

print_stack_trace_on_error_pages = false
log_error_responses = false
log.application.level = info
log.application.ConsoleAppender.enabled = true
log.application.FileAppender.enabled = false
log.application.RollingFileAppender.enabled = false
log.error.FileAppender.enabled = false
log.error.RollingFileAppender.enabled = false
log.access.ConsoleAppender.enabled = true
log.access.FileAppender.enabled = false
log.access.RollingFileAppender.enabled = false
