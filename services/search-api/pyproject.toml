[project]
name = "search-api"
version = "0.1.0"
description = "Ship Archive Lite read side: public search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "pydantic-settings==2.7.0",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
