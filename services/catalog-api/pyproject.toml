[project]
name = "catalog-api"
version = "0.1.0"
description = "Ship Archive Lite write side"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic-settings==2.7.0",
    "boto3==1.43.117",
    "python-multipart==0.0.32",
    "jsonschema==4.26.0",
    "pika==1.4.4",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "moto[server]==5.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
