[project]
name = "archive-seed"
version = "0.1.0"
description = "Ship Archive Lite demo data: synthetic Swedish documents, a fictional fleet and public-domain plates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pillow==11.3.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytesseract==0.3.13",
    "moto[server]==5.2.4",
    "pika==1.4.4",
    "catalog-api",
]

[tool.uv.sources]
catalog-api = { path = "../services/catalog-api" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive_seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
