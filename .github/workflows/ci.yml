name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-api, transcribe-worker, indexer, search-api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: archive_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.7-alpine
        ports: ["56672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: "true"
        ports: ["57700:7700"]
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      # The worker tests run the real OCR engine, with the English and Swedish language data.
      - name: Install Tesseract
        if: matrix.service == 'transcribe-worker'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-swe
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - run: uv run pytest -q

  test-web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-web-ui]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-api, transcribe-worker, indexer, search-api, web-ui, cantaloupe]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Work out the image version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Check the manifests pin this version
        run: ./scripts/check-release.sh "$VERSION" "${{ vars.DOCKERHUB_USERNAME }}"
      # Both architectures: the cluster runs arm64 on Apple Silicon, CI runs amd64.
      # The build context is the repository root because every service copies /contracts.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/ship-archive-${{ matrix.service }}:${{ env.VERSION }}
